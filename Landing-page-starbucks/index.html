<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"/>
    <script src="src/js/script.js" defer></script>
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <img src="src/images/logo-starbucks.png" alt="Starbucks Logo" class="logo">

            <button class="btn btn-mobile">
                <i class="fas fa-bars"></i>
            </button>

            <ul id="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#trending">Em alta</a></li>
                <li><a href="#about">Sobre nós</a></li>
                <li><a href="#products">Novidades</a></li>
            </ul>

            <a href="#" class="btn btn-default">Contatar</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main id="container">

        <!-- HOME -->
        <section id="home">
            <img src="src/images/detail.png" alt="Starbucks drink" class="home-image">

            <h1 class="home-title">
                Mais que um café, uma
                <span>experiência</span>
            </h1>

            <p class="home-description">
                Descubra o sabor único do nosso café e aproveite momentos especiais com amigos e familiares. Venha nos visitar e viva a experiência Starbucks! 
            </p>

            <div class="home-actions">
                <a href="#" class="btn btn-default">Conhecer</a>
                <a href="#" class="btn btn-outlined">Contatar</a>
            </div>
        </section>

    </main>
</body>
</html>
